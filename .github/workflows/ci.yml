name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore backend/ParallelWorld.sln --configfile NuGet.Config

      - name: Verify formatting
        run: dotnet format backend/ParallelWorld.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build backend/ParallelWorld.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/ParallelWorld.sln --configuration Release --no-build

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/parallel_world_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
