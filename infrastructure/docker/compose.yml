name: parallel-world

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: parallel_world
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a local-only value}
      POSTGRES_USER: parallel_world
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallel_world -d parallel_world"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - parallel-world-postgres:/var/lib/postgresql

  api:
    build:
      context: ../..
      dockerfile: backend/src/ParallelWorld.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=parallel_world;Username=parallel_world;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a local-only value}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  parallel-world-postgres:
